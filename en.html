  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restaurant Sales Dashboard</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

  <link href="style.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<body class="d-flex flex-column min-vh-100 justify-content-between">

  <!-- ==================== HEADER ==================== -->
  <header class="navbar navbar-expand-lg navbar-light bg-light sticky-top shadow-sm py-2">
    <div class="container-fluid">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#">
        <span class="logo-icon" aria-hidden="true">
          <svg viewBox="0 0 64 64" width="32" height="32" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="30" width="10" height="26" rx="3" fill="#0d6efd"/>
            <rect x="26" y="20" width="10" height="36" rx="3" fill="#3b82f6"/>
            <rect x="44" y="12" width="10" height="44" rx="3" fill="#7dd3fc"/>
            <circle cx="32" cy="20" r="4" fill="#fff" opacity="0.9"/>
          </svg>
        </span>
        <span id="brandText">Stats</span>
      </a>
      <div class="d-flex align-items-center gap-2 ms-auto">
        <a id="langToggleBtn" class="btn btn-outline-secondary" href="index.html" aria-label="Switch to Spanish">ES</a>
        <!-- <a id="signInBtn" href="#" class="btn btn-outline-primary">Sign In</a>
        <a id="signUpBtn" href="#" class="btn btn-primary">Sign Up</a> -->
        <button id="darkModeToggle" class="dark-mode-btn" aria-label="Toggle dark mode">🌙</button>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN CONTENT ==================== -->
  <main class="flex-grow-1 my-4">
    <div class="container-fluid">

      <!-- Loading screen -->
      <div id="loadingScreen" class="loading-screen d-flex justify-content-center align-items-center">
        <div class="loader-card text-center p-4 rounded-4 shadow-lg">
          <div class="chart-loader-icon mb-3" aria-hidden="true">
            <span class="loader-bar bar-1"></span>
            <span class="loader-bar bar-2"></span>
            <span class="loader-bar bar-3"></span>
            <span class="loader-bar bar-4"></span>
          </div>
          <div id="loaderSpinner" class="spinner-border text-primary mb-3 d-none" role="status"><span class="visually-hidden">Loading...</span></div>
          <button id="loadDataBtn" class="btn btn-primary mb-3" aria-label="Load Data">Load Data</button>
          <h2 id="loadingTitle" class="h4 mb-2">Preparing your dashboard</h2>
          <p id="loadingSubtitle" class="text-secondary mb-0">Fetching fresh sales data and assembling the charts.</p>
        </div>
      </div>

      <div id="appContent" class="d-none">
        <h3 id="mainHeading" class="mb-4 text-center">Restaurant Estrella — Graphs & Charts</h3>

        <div class="row g-4 mb-4 align-items-stretch justify-content-center">
          <div class="col-12 col-md-4">
            <div class="chart-card card h-100 p-3">
              <div id="legendCategory" class="chart-label-line mb-3"></div>
              <canvas id="chartCategoryPie"></canvas>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="chart-card card h-100 p-3">
              <div id="legendHour" class="chart-label-line mb-3"></div>
              <canvas id="chartOrdersHourDoughnut"></canvas>
            </div>
          </div>
          <div class="col-12 col-md-4">
            <div class="chart-card card h-100 p-3">
              <div id="legendItems" class="chart-label-line mb-3"></div>
              <canvas id="chartTopItemsPie"></canvas>
            </div>
          </div>
        </div>

        <div class="row g-4 justify-content-center">
          <div class="col-12 col-xl-10">
            <div class="chart-card card p-3">
              <canvas id="chartDailyRevenueBar"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- ==================== FOOTER ==================== -->
  <footer class="sticky-footer bg-light text-center py-3 shadow-sm">
    <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center gap-2">

        Phone: +34 969 636 773
      </span>
    </div>
  </footer>

  <!-- ==================== SCRIPTS ==================== -->
  <script type="module" src="main.js"></script>

    crossorigin="anonymous"></script>
</body>

</html>
